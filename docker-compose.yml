x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: prod
  network_mode: host
  privileged: true
  volumes:
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./data:/app/data
    - ./viki:/app/viki
    - ./models:/app/models
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - DISPLAY=${DISPLAY}
    - LIBGL_ALWAYS_SOFTWARE=1
    - GALLIUM_DRIVER=llvmpipe
  devices:
    - /dev/dri:/dev/dri

services:
  frontend-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: viki-frontend-builder
    volumes:
      - ./viki:/app/viki
    restart: "no"

  viki:
    <<: *common
    container_name: viki
    restart: unless-stopped
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["uvicorn", "viki.server.app:app", "--host", "0.0.0.0", "--port", "8000"]  #, "--reload"]

  terminal:
    <<: *common
    network_mode: "host"
    container_name: viki-terminal
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["/bin/bash"]
    restart: "no"
    profiles:
      - tools
