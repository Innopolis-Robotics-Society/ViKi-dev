x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: backend
  network_mode: host
  privileged: true
  volumes:
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./data:/app/data
    - ./viki:/app/viki
    - ./scripts:/app/scripts
    - ./models:/app/models
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app
    - GIT_PYTHON_REFRESH=quiet
    - DISPLAY=${DISPLAY}
    - LIBGL_ALWAYS_SOFTWARE=1
    - GALLIUM_DRIVER=llvmpipe
  devices:
    - /dev/dri:/dev/dri

services:
  viki:
    <<: *common
    container_name: viki
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["uvicorn", "viki.server.app:app", "--host", "0.0.0.0", "--port", "8000"]  #, "--reload"]

  # Disabled — frontend is now served directly from FastAPI (viki/server/static/).
  # streamlit:
  #   build:
  #     context: .
  #     dockerfile: docker/frontend.Dockerfile
  #   network_mode: host
  #   volumes:
  #     - ./viki:/app/viki
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - PYTHONPATH=/app
  #   container_name: viki-streamlit
  #   restart: unless-stopped
  #   depends_on:
  #     - viki
  #   command:
  #     - streamlit
  #     - run
  #     - viki/streamlit_app/app.py
  #     - --server.port=8501
  #     - --server.address=0.0.0.0
  #     - --server.headless=true

  terminal:
    <<: *common
    network_mode: "host"
    container_name: viki-terminal
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["/bin/bash"]
    restart: "no"
    profiles:
      - tools
