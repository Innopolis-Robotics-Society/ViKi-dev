x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
  network_mode: host
  privileged: true
  volumes:
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - ./viki:/app/viki
    - /dev/bus/usb:/dev/bus/usb
    - ./pyproject.toml:/app/pyproject.toml:ro
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app


services:
  viki:
    <<: *common
    container_name: viki
    restart: unless-stopped

  terminal:
    <<: *common
    container_name: viki-terminal
    stdin_open: true
    tty: true
    command: /bin/bash
    restart: "no"