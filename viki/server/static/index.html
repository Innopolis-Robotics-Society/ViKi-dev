<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViKi — Capture</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a30;
      --accent: #5b7fff;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    header .subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.alive {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
    }

    .toolbar .sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: all 0.15s;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      opacity: 0.85;
    }

    button.danger {
      border-color: var(--red);
      color: var(--red);
    }

    button.danger:hover {
      background: var(--red);
      color: #fff;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    select,
    input[type=number] {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
    }

    label {
      color: var(--muted);
      font-size: 11px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(660px, 1fr));
      gap: 16px;
      padding: 16px 24px;
    }

    .camera-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .camera-card.running {
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-header .name {
      font-weight: 600;
      font-size: 12px;
      flex: 1;
    }

    .tag {
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      background: var(--border);
      color: var(--muted);
    }

    .tag.realsense {
      background: #1a2a4a;
      color: #5b9fff;
    }

    .tag.kinect {
      background: #1a3a2a;
      color: #4ade80;
    }

    .tag.running {
      background: #1a3a1a;
      color: var(--green);
    }

    .card-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-controls .sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    .streams {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .stream-panel {
      position: relative;
      background: #000;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .skel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .stream-panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .stream-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .stream-divider {
      width: 1px;
      background: var(--border);
    }

    .card-footer {
      display: flex;
      gap: 16px;
      padding: 8px 14px;
      font-size: 11px;
      color: var(--muted);
    }

    #log {
      margin: 0 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11px;
      color: var(--muted);
      max-height: 120px;
      overflow-y: auto;
    }

    #log .entry {
      padding: 1px 0;
    }

    #log .entry.error {
      color: var(--red);
    }

    #log .entry.ok {
      color: var(--green);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-state h2 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .calib-stream-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      max-height: 100%;
    }
    .calib-img-container {
      position: relative;
      display: inline-block;
    }
    .calib-stream-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .calib-stream-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
    }
    .calib-count {
      color: var(--accent);
      margin-left: 4px;
    }

    .calib-panel {
      display: none;
      margin: 0 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .calib-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .calib-header .title {
      font-weight: 600;
      font-size: 12px;
      color: var(--accent);
    }

    .calib-body {
      display: flex;
      gap: 20px;
      padding: 14px;
    }

    .calib-streams {
      flex: 1;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-height: 600px;
    }

    .calib-controls {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .calib-stats {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .skeleton-panel {
      display: none;
      margin: 0 24px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .skeleton-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .skeleton-header .title {
      font-weight: 600;
      font-size: 12px;
      color: var(--accent);
    }

    .skeleton-body {
      display: flex;
      gap: 20px;
      padding: 14px;
    }

    .skeleton-viz {
      flex: 1;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      min-height: 400px;
    }

    .skeleton-controls {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skeleton-table-container {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #skel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }
    #skel-table th, #skel-table td {
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
    }
    #skel-table th {
      position: sticky;
      top: 0;
      background: var(--surface);
      color: var(--muted);
    }
    #skel-canvas-3d {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <header>
    <div class="dot" id="server-dot"></div>
    <h1>ViKi</h1>
    <span class="subtitle">capture server</span>
  </header>

  <div class="toolbar">
    <button class="primary" onclick="scanDevices()">⟳ Scan devices</button>
    <button onclick="startAll()">▶ Start all</button>
    <button class="danger" onclick="stopAll()">■ Stop all</button>
    <div class="sep"></div>
    <button id="btn-calib-toggle" onclick="toggleCalibration()">⚙ Calibration</button>
    <button id="btn-skeleton-toggle" onclick="toggleSkeleton()">🦴 Skeleton</button>
  </div>

  <div class="calib-panel" id="calib-panel">
    <div class="calib-header">
      <span class="title">Camera Calibration</span>
      <button class="danger" onclick="toggleCalibration()">✕ Close</button>
    </div>
    <div class="calib-body">
      <div id="calib-streams" class="calib-streams">
        <!-- streams -->
      </div>
      <div class="calib-controls">
        <div class="board-params">
          <!-- Board type selector -->
          <div class="field-row">
            <label for="board-type">Board type</label>
            <select id="board-type" onchange="toggleBoardFields()">
              <option value="chess">Chessboard</option>
              <option value="aruco">ChArUco</option>
            </select>
          </div>

          <!-- Common fields (always visible) -->
          <div class="field-row">
            <label>Board width</label>
            <input type="number" id="board-width" value="8" min="1" />
          </div>
          <div class="field-row">
            <label>Board height</label>
            <input type="number" id="board-height" value="6" min="1" />
          </div>
          <div class="field-row">
            <label>Square size (m)</label>
            <input type="number" id="square-size" value="0.025" step="0.001" min="0.01" />
          </div>

          <!-- Aruco‑specific fields (hidden by default) -->
          <div id="aruco-fields" style="display: none;">
            <div class="field-row">
              <label>Marker size (m)</label>
              <input type="number" id="marker-size" value="0.8" step="0.001" min="0.01" />
            </div>
            <div class="field-row">
              <label>Dictionary</label>
              <select id="aruco-dict"></select>
            </div>
          </div>
        </div>
        <button onclick="startCalibrationSession()">Start Calibration</button>
        <button class="primary" onclick="captureSample()">Capture Sample</button>
        <button onclick="intrinsicsCalibration()">Start Intrinsics</button>
        <button class="danger" onclick="clearCalibration()">Clear Samples</button>
      </div>
    </div>
  </div>

  <div class="skeleton-panel" id="skeleton-panel">
    <div class="skeleton-header">
      <span class="title">3D Skeleton Estimation</span>
      <button class="danger" onclick="toggleSkeleton()">✕ Close</button>
    </div>
      <div class="skeleton-body">
        <div class="skeleton-viz" id="skeleton-viz" style="display:flex; align-items:center; justify-content:center;">
          <canvas id="skel-canvas-3d"></canvas>
        </div>
    <div class="skeleton-controls">
      <div class="skeleton-stats" id="skeleton-status">Status: Idle</div>
      <div id="skeleton-detections" style="font-size: 11px; color: var(--muted); margin-bottom: 10px;"></div>
      <div class="field-row" style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px;">
        <label for="skel-viz-cam">Visualize Camera</label>
            <select id="skel-viz-cam" onchange="updateSkelVizCam()"></select>
          </div>
          <button id="btn-skel-start" class="primary" onclick="toggleEstimation(true)">▶ Start Estimation</button>
          <button id="btn-skel-stop" class="danger" onclick="toggleEstimation(false)" disabled>■ Stop Estimation</button>
          <div class="sep"></div>
          <button id="btn-skel-rec-start" onclick="toggleRecording(true)">🔴 Record</button>
          <button id="btn-skel-rec-stop" class="danger" onclick="toggleRecording(false)" disabled>⏹ Stop Recording</button>
          
          <div class="skeleton-table-container">
            <table id="skel-table">
              <thead>
                <tr><th>Joint</th><th>X</th><th>Y</th><th>Z</th></tr>
              </thead>
              <tbody id="skel-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

  </div>

  <div class="grid" id="grid">
    <div class="empty-state">
      <h2>No cameras detected</h2>
      <p>Click "Scan devices" to discover connected cameras</p>
    </div>
  </div>

  <div id="log"></div>

  <script>
    // Per-camera config definitions
    const CAMERA_CONFIG = {
      realsense: {
        resolutions: ['640x480', '1280x720', '1920x1080'],
        defaultRes: '640x480',
        fps: [15, 30],
        defaultFps: 30,
        depthModes: null,
      },
      kinect: {
        resolutions: ['1280x720', '1920x1080', '2048x1536'],
        defaultRes: '1280x720',
        fps: [5, 15, 30],
        defaultFps: 15,
        depthModes: ['NFOV_UNBINNED', 'NFOV_2X2BINNED', 'WFOV_UNBINNED', 'WFOV_2X2BINNED'],
        defaultDepth: 'NFOV_UNBINNED',
        // WFOV_UNBINNED hardware limitation: max 15 fps
        depthModeMaxFps: {'WFOV_UNBINNED': 15},
      },
    };

    const ARUCO_DICTS = [
      'DICT_4X4_50', 'DICT_4X4_100', 'DICT_4X4_250', 'DICT_4X4_1000',
      'DICT_5X5_50', 'DICT_5X5_100', 'DICT_5X5_250', 'DICT_5X5_1000',
      'DICT_6X6_50', 'DICT_6X6_100', 'DICT_6X6_250', 'DICT_6X6_1000',
      'DICT_7X7_50', 'DICT_7X7_100', 'DICT_7X7_250', 'DICT_7X7_1000',
      'DICT_ARUCO_ORIGINAL'
    ];

    function populateArucoDicts() {
      const select = document.getElementById("aruco-dict");
      select.innerHTML = "";
      ARUCO_DICTS.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        if (name == "DICT_5X5_50") opt.selected = true;
        select.appendChild(opt);
      });
    }

    function toggleBoardFields() {
      const boardType = document.getElementById("board-type").value;
      document.getElementById('aruco-fields').style.display = boardType === 'aruco' ? 'block' : 'none';
    }

    const state = {};    // device_id -> { running, type, infoInterval }

    function log(msg, cls = '') {
      const el = document.getElementById('log');
      const e = document.createElement('div');
      e.className = 'entry ' + cls;
      e.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.prepend(e);
      while (el.children.length > 40) el.removeChild(el.lastChild);
    }

    async function api(method, path, body) {
      const opts = {method, headers: {'Content-Type': 'application/json'}};
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      const data = await r.json();
      if (!r.ok) {
        throw new Error(data.detail || 'API request failed');
      }
      return data;
    }

    async function checkServer() {
      try {
        await fetch('/api/devices');
        document.getElementById('server-dot').classList.add('alive');
      } catch {
        document.getElementById('server-dot').classList.remove('alive');
      }
    }

    async function scanDevices() {
      log('Scanning for devices...');
      try {
        const data = await api('GET', '/api/devices');
        log(`Found: ${data.realsense.length} RealSense, ${data.kinect.length} Kinect`, 'ok');
        const all = [
          ...data.realsense.map(id => ({id, type: 'realsense'})),
          ...data.kinect.map(id => ({id, type: 'kinect'})),
          // ...data.web_camera.map(id => ({id, type: "web_camera"})),
        ];
        renderCards(all, data.active || []);
      } catch (e) {
        log('Scan failed: ' + e, 'error');
      }
    }

    function renderCards(devices, active) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!devices.length) {
        grid.innerHTML = `<div class="empty-state"><h2>No cameras detected</h2><p>Make sure cameras are connected and container has USB access.</p></div>`;
        return;
      }
      devices.forEach(d => {
        const isActive = active.includes(d.id);
        state[d.id] = {running: isActive, type: d.type, ...(state[d.id] || {})};
        grid.appendChild(buildCard(d.id, d.type, isActive));
        if (isActive) attachStreams(d.id);
      });
    }

    function buildControls(id, type) {
      const cfg = CAMERA_CONFIG[type] || CAMERA_CONFIG.realsense;

      const resOpts = cfg.resolutions.map(r =>
        `<option value="${r}" ${r === cfg.defaultRes ? 'selected' : ''}>${r.replace('x', ' × ')}</option>`
      ).join('');

      const fpsOpts = cfg.fps.map(f =>
        `<option value="${f}" ${f === cfg.defaultFps ? 'selected' : ''}>${f} fps</option>`
      ).join('');

      let depthPart = '';
      if (cfg.depthModes) {
        const dOpts = cfg.depthModes.map(m =>
          `<option value="${m}" ${m === cfg.defaultDepth ? 'selected' : ''}>${m}</option>`
        ).join('');
        depthPart = `<div class="sep"></div><label>depth</label><select id="depthmode-${id}" onchange="updateFpsForDepthMode('${id}')">${dOpts}</select>`;
      }

      return `
    <label>res</label><select id="res-${id}">${resOpts}</select>
    <label>fps</label><select id="fps-${id}">${fpsOpts}</select>
    ${depthPart}
  `;
    }

    function buildCard(id, type, running) {
      const card = document.createElement('div');
      card.className = 'camera-card' + (running ? ' running' : '');
      card.id = 'card-' + id;
      card.innerHTML = `
    <div class="card-header">
      <div class="dot ${running ? 'alive' : ''}" id="dot-${id}"></div>
      <span class="name">${id}</span>
      <span class="tag ${type}">${type}</span>
      ${running ? `<span class="tag running" id="live-tag-${id}">LIVE</span>` : `<span class="tag running" id="live-tag-${id}" style="display:none">LIVE</span>`}
    </div>
    <div class="card-controls">
      <button id="btn-start-${id}" ${running ? 'disabled' : ''} onclick="startCamera('${id}')">▶ Start</button>
      <button id="btn-stop-${id}"  ${running ? '' : 'disabled'} class="danger" onclick="stopCamera('${id}')">■ Stop</button>
      <div class="sep"></div>
      ${buildControls(id, type)}
    </div>
    <div class="streams">
      <div class="stream-panel">
        <img id="color-${id}" src="" alt="color">
        <canvas id="skel-canvas-${id}" class="skel-overlay"></canvas>
        <span class="stream-label">COLOR</span>
      </div>
      <div class="stream-divider"></div>
      <div class="stream-panel">
        <img id="depth-${id}" src="" alt="depth">
        <span class="stream-label">DEPTH</span>
      </div>
    </div>
    <div class="card-footer" id="footer-${id}"><span>—</span></div>
  `;
      return card;
    }

    function updateFpsForDepthMode(id) {
      const cfg = CAMERA_CONFIG[state[id]?.type] || CAMERA_CONFIG.realsense;
      if (!cfg.depthModeMaxFps) return;
      const depthMode = document.getElementById(`depthmode-${id}`)?.value;
      const maxFps = cfg.depthModeMaxFps[depthMode] || 30;
      const fpsSelect = document.getElementById(`fps-${id}`);
      if (!fpsSelect) return;
      for (const opt of fpsSelect.options) {
        opt.disabled = parseInt(opt.value) > maxFps;
        if (parseInt(opt.value) > maxFps && fpsSelect.value === opt.value) {
          fpsSelect.value = maxFps;
        }
      }
    }

    function getCardConfig(id) {
      const resVal = document.getElementById(`res-${id}`)?.value || '640x480';
      const [w, h] = resVal.split('x').map(Number);
      const fps = parseInt(document.getElementById(`fps-${id}`)?.value || '30');
      const depth = document.getElementById(`depthmode-${id}`)?.value || 'NFOV_UNBINNED';
      return {color_width: w, color_height: h, fps, depth_mode: depth};
    }

    function attachStreams(id) {
      const colorImg = document.getElementById('color-' + id);
      const depthImg = document.getElementById('depth-' + id);
      // Small delay to let the camera worker produce first frame before streaming
      setTimeout(() => {
        if (colorImg) colorImg.src = `/api/cameras/${id}/stream?t=${Date.now()}`;
        if (depthImg) depthImg.src = `/api/cameras/${id}/depth?t=${Date.now()}`;
      }, 1500);
      if (state[id]?.infoInterval) clearInterval(state[id].infoInterval);
      state[id].infoInterval = setInterval(() => updateInfo(id), 2000);
    }

    function detachStreams(id) {
      const colorImg = document.getElementById('color-' + id);
      const depthImg = document.getElementById('depth-' + id);
      if (colorImg) colorImg.src = '';
      if (depthImg) depthImg.src = '';
      if (state[id]?.infoInterval) clearInterval(state[id].infoInterval);
    }

    async function updateInfo(id) {
      try {
        const info = await api('GET', `/api/cameras/${id}/info`);
        const footer = document.getElementById('footer-' + id);
        if (!footer) return;

        if (!info) return;

        // Update color panel aspect ratio
        if (info.color_shape) {
          const [ch, cw] = info.color_shape;
          const colorPanel = document.querySelector(`#card-${id} .stream-panel:first-child`);
          if (colorPanel) colorPanel.style.aspectRatio = `${cw}/${ch}`;
        }

        // Update depth panel aspect ratio
        if (info.depth_shape) {
          const [dh, dw] = info.depth_shape;
          const depthPanel = document.querySelector(`#card-${id} .stream-panel:last-child`);
          if (depthPanel) depthPanel.style.aspectRatio = `${dw}/${dh}`;
        }

        const shape = info.color_shape ? `${info.color_shape[1]}×${info.color_shape[0]}` : '—';
        const dshape = info.depth_shape ? `depth: ${info.depth_shape[1]}×${info.depth_shape[0]}` : '';
        const ci = info.color_intrinsics;
        const intr = ci ? `fx=${ci.fx.toFixed(1)} fy=${ci.fy.toFixed(1)}` : '';
        footer.innerHTML = `<span>color: ${shape}</span><span>${dshape}</span><span>${intr}</span>`;
      } catch { /* camera stopped */}
    }

    async function startCamera(id) {
      const cfg = getCardConfig(id);
      log(`Starting ${id} @ ${cfg.color_width}×${cfg.color_height} ${cfg.fps}fps...`);
      try {
        const res = await api('POST', `/api/cameras/${id}/start`, cfg);
        if (res.detail) {log(`${id} error: ${res.detail}`, 'error'); return;}
        log(`${id} started`, 'ok');
        setRunning(id, true);
      } catch (e) {
        log(`Failed to start ${id}: ${e}`, 'error');
      }
    }

    async function stopCamera(id) {
      log(`Stopping ${id}...`);
      await api('POST', `/api/cameras/${id}/stop`);
      log(`${id} stopped`);
      setRunning(id, false);
    }

    function setRunning(id, running) {
      if (!state[id]) state[id] = {};
      state[id].running = running;
      const card = document.getElementById('card-' + id);
      const dot = document.getElementById('dot-' + id);
      const liveTag = document.getElementById('live-tag-' + id);
      const btnStart = document.getElementById('btn-start-' + id);
      const btnStop = document.getElementById('btn-stop-' + id);
      if (!card) return;
      card.className = 'camera-card' + (running ? ' running' : '');
      if (dot) dot.className = 'dot' + (running ? ' alive' : '');
      if (liveTag) liveTag.style.display = running ? '' : 'none';
      if (btnStart) btnStart.disabled = running;
      if (btnStop) btnStop.disabled = !running;
      if (running) attachStreams(id);
      else detachStreams(id);
    }

    async function startAll() {
      for (const id of Object.keys(state))
        if (!state[id].running) await startCamera(id);
    }

    async function stopAll() {
      for (const id of Object.keys(state))
        if (state[id].running) await stopCamera(id);
    }

    function toggleCalibration() {
      const panel = document.getElementById('calib-panel');
      const isVisible = panel.style.display === 'block';
      panel.style.display = isVisible ? 'none' : 'block';

      if (!isVisible) {
        populateCalibrationStreams();
        updateCalibStatus();
      } else {
        clearCalibrationStreams();
        resetCalibration();
        document.getElementById('calib-streams').innerHTML = '';
      }
    }

    async function resetCalibration() {
      await api('POST', `/api/calibration/reset`);
    }

    function populateCalibrationStreams() {
      const container = document.getElementById('calib-streams');
      container.innerHTML = '';
      const deviceIds = Object.keys(state);
      if (deviceIds.length === 0) {
        container.innerHTML = '<div style="color:var(--muted);padding:20px;">No cameras detected</div>';
        return;
      }

      container.className = 'calib-streams';
      deviceIds.forEach(id => {
        const wrapper = document.createElement('div');
        wrapper.className = 'calib-stream-wrapper';
        wrapper.dataset.deviceId = id;

        const imgContainer = document.createElement('div');
        imgContainer.className = 'calib-img-container';

        const img = document.createElement('img');
        img.src = `/api/cameras/${id}/stream?mode=color&t=${Date.now()}`;
        imgContainer.appendChild(img);

        const label = document.createElement('span');
        label.className = 'calib-stream-label';
        label.innerHTML = `${id} <span class="calib-count" id="calib-count-${id}">(…)</span>`;
        imgContainer.appendChild(label);

        wrapper.appendChild(imgContainer);
        container.appendChild(wrapper);
      });

      updateCalibStatus();
    }

    function clearCalibrationStreams() {
      const container = document.getElementById('calib-streams');
      container.querySelectorAll('img').forEach(img => img.src = '');
      container.innerHTML = '';
    }

    async function updateCalibStatus() {
      const deviceIds = Object.keys(state);
      for (const id of deviceIds) {
        const countEl = document.getElementById(`calib-count-${id}`);
        if (!countEl) continue;
        try {
          const data = await api('GET', `/api/calibration/status/${id}`);
          countEl.textContent = `(${data.samples_count} samples)`;
        } catch (e) {
          countEl.textContent = `(error)`;
          log(`Status check for ${id} failed`, 'error');
        }
      }
    }

    async function captureSample() {
      log('Capturing calibration sample...');
      try {
        await api('POST', '/api/calibration/capture');
        log('Sample captured successfully', 'ok');
        updateCalibStatus();
      } catch (e) {
        log(`Capture failed: ${e}`, 'error');
      }
    }

    async function startCalibrationSession() {
      resetCalibration();
      const boardType = document.getElementById('board-type').value;
      log(`Starting calibration session (${boardType} board)...`);

      const width = parseInt(document.getElementById('board-width').value, 10);
      const height = parseInt(document.getElementById('board-height').value, 10);
      const squareSize = parseFloat(document.getElementById('square-size').value);

      if (boardType === 'chess') {
        params = {
          board_size: [width, height],
          square_size: squareSize
        };
        endpoint = (id) => `/api/calibration/start/${id}`;
      } else { // aruco
        const markerSize = parseFloat(document.getElementById('marker-size').value);
        const arucoDict = document.getElementById('aruco-dict').value;
        params = {
          board_size: [width, height],
          square_size: squareSize,
          marker_size: markerSize,
          aruco_dict: arucoDict
        };
        endpoint = (id) => `/api/calibration/start/aruco/${id}`;
      }

      for (const id of Object.keys(state)) {
        try {
          await api('POST', endpoint(id) + "?mode=manual", params);
        } catch (e) {
          log(`Calibration session start failed: ${e}`, 'error');
        }
      }
      updateCalibStatus();
    }

    async function clearCalibration() {
      await api('POST', '/api/calibration/clear');
      log('Calibration samples cleared');
      updateCalibStatus();
    }

    // --- Skeleton Logic ---
    let skeletonWs = null;
    let skelPoints = []; // Current 3D points for the selected camera
    let selectedSkelCam = null;

    const SKEL_NAMES = ['Wrist', 'Thumb CMC', 'Thumb MCP', 'Thumb IP', 'Thumb Tip', 'Index MCP', 'Index PIP', 'Index DIP', 'Index Tip', 'Middle MCP', 'Middle PIP', 'Middle DIP', 'Middle Tip', 'Ring MCP', 'Ring PIP', 'Ring DIP', 'Ring Tip', 'Pinky MCP', 'Pinky PIP', 'Pinky DIP', 'Pinky Tip', 'Elbow', 'Shoulder'];
    const SKEL_CONNS = [
      [22, 21], [21, 0], // Arm
      [0, 1], [1, 2], [2, 3], [3, 4], // Thumb
      [0, 5], [5, 6], [6, 7], [7, 8], // Index
      [5, 9], [9, 10], [10, 11], [11, 12], // Middle
      [9, 13], [13, 14], [14, 15], [15, 16], // Ring
      [13, 17], [17, 18], [18, 19], [19, 20], // Pinky
      [5, 9], [9, 13], [13, 17], // Palm
    ];

    function populateSkelVizCams() {
      const select = document.getElementById('skel-viz-cam');
      if (!select) return;
      select.innerHTML = '';
      Object.keys(state).forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      });
      updateSkelVizCam();
    }

    function updateSkelVizCam() {
      selectedSkelCam = document.getElementById('skel-viz-cam')?.value;
      // Clear current viz if changing camera
      skelPoints = [];
      drawSkeleton3D([]);
      document.getElementById('skel-table-body').innerHTML = '';
    }

    function drawSkeleton3D(landmarks) {
      const canvas = document.getElementById('skel-canvas-3d');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      // Set canvas size to match container
      const container = document.getElementById('skeleton-viz');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!landmarks || landmarks.length === 0) return;

      // Simple Orthographic Projection (XZ plane)
      const scale = 500;
      const offset = { x: canvas.width / 2, y: canvas.height / 2 };
      
      const project = (p) => ({
        x: offset.x + p[0] * scale,
        y: offset.y - p[1] * scale, // Invert Y for screen
      });
      
      ctx.strokeStyle = '#5b7fff';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#fff';
      
      SKEL_CONNS.forEach(([a, b]) => {
        if (landmarks[a] && landmarks[b]) {
          const p1 = project(landmarks[a]);
          const p2 = project(landmarks[b]);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });
      
      landmarks.forEach((p, i) => {
        if (!p) return;
        const proj = project(p);
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function updateSkeletonUI(deviceId, landmarks) {
      if (deviceId !== selectedSkelCam) return;

      const tableBody = document.getElementById('skel-table-body');
      if (tableBody) {
        tableBody.innerHTML = '';
        landmarks.forEach((p, i) => {
          if (!p) return;
          const row = document.createElement('tr');
          row.innerHTML = `<td>${SKEL_NAMES[i] || i}</td><td>${p[0].toFixed(3)}</td><td>${p[1].toFixed(3)}</td><td>${p[2].toFixed(3)}</td>`;
          tableBody.appendChild(row);
        });
      }
      
      drawSkeleton3D(landmarks);
    }

    function toggleSkeleton() {
      const panel = document.getElementById('skeleton-panel');
      const isVisible = panel.style.display === 'block';
      panel.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) {
        populateSkelVizCams();
        updateSkelStatus();
      }
    }

    async function updateSkelStatus() {
      try {
        const data = await api('GET', '/api/skeleton/status');
        const statusEl = document.getElementById('skeleton-status');
        statusEl.textContent = `Status: ${data.enabled ? 'Running' : 'Idle'} ${data.recording ? ' (RECORDING)' : ''}`;

        document.getElementById('btn-skel-start').disabled = data.enabled;
        document.getElementById('btn-skel-stop').disabled = !data.enabled;
        document.getElementById('btn-skel-rec-start').disabled = !data.enabled;
        document.getElementById('btn-skel-rec-stop').disabled = !data.recording;
      } catch (e) {
        log('Skel status check failed', 'error');
      }
    }

    async function toggleEstimation(enable) {
      log(`Turning skeleton estimation ${enable ? 'ON' : 'OFF'}...`);
      try {
        await api('POST', '/api/skeleton/toggle', {enabled: enable});
        updateSkelStatus();
        if (enable) {
          startSkelStream();
        } else {
          stopSkelStream();
        }
      } catch (e) {
        log('Estimation toggle failed: ' + e, 'error');
      }
    }

    async function toggleRecording(enable) {
      log(`Turning skeleton recording ${enable ? 'ON' : 'OFF'}...`);
      try {
        await api('POST', '/api/skeleton/record', {enabled: enable});
        updateSkelStatus();
      } catch (e) {
        log('Recording toggle failed: ' + e, 'error');
      }
    }

    function startSkelStream() {
      if (skeletonWs) return;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/skeleton/stream`;
      skeletonWs = new WebSocket(wsUrl);

      skeletonWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const detections = data.detections;

        // Update detection status in panel
        const detEl = document.getElementById('skeleton-detections');
        if (detEl) {
          const statusHtml = Object.keys(state).map(id => {
            const detected = !!detections[id];
            return `<div style="color: ${detected ? 'var(--green)' : 'var(--red)'}">${id}: ${detected ? 'Detected' : 'Not Detected'}</div>`;
          }).join('');
          detEl.innerHTML = statusHtml;
        }

        for (const [deviceId, det] of Object.entries(detections)) {
          if (!det) continue;

          // Prepare 3D points for table/viz (normalized)
          let pts3d = det;
          if (typeof det === 'object' && 'px' in det) {
            const img = document.getElementById(`color-${deviceId}`);
            const w = img ? img.naturalWidth : 640;
            const h = img ? img.naturalHeight : 480;
            pts3d = det.px.map((p, i) => [
              p[0] / w, 
              p[1] / h, 
              (det.lm_z_rel && det.lm_z_rel[i]) || 0
            ]);
          }
          updateSkeletonUI(deviceId, pts3d);

          // 2D Overlay
          const canvas = document.getElementById(`skel-canvas-${deviceId}`);
          if (!canvas) continue;
          
          const pts2d = (typeof det === 'object' && 'px' in det) ? det.px : det;
          if (!pts2d || !Array.isArray(pts2d)) continue;

          const ctx = canvas.getContext('2d');
          const img = document.getElementById(`color-${deviceId}`);
          if (!img) continue;

          // Sync canvas size to current image display size
          canvas.width = img.clientWidth;
          canvas.height = img.clientHeight;

          // Image is center-fit, we need to find the actual image area within the panel
          // For simplicity, we assume the canvas matches the image's rendering.
          // Since the image has object-fit: contain, we'd ideally need to calculate the offset.
          // But as a first pass, we'll draw based on the normalized pixels (u, v) relative to the image.
          
          // The backend sends pixels as absolute image coords (u, v).
          // We need to scale them to the displayed image size.
          const scaleX = canvas.width / img.naturalWidth;
          const scaleY = canvas.height / img.naturalHeight;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = '#5b7fff';
          ctx.fillStyle = '#5b7fff';
          ctx.lineWidth = 3;

          // Landmarks for arm chain: Wrist (0), Elbow (21), Shoulder (22)
           const indices = [0, 21, 22];
           const coords = indices.map(i => pts2d[i] ? [pts2d[i][0] * scaleX, pts2d[i][1] * scaleY] : null);


          // Draw lines
          ctx.beginPath();
          for (let i = 0; i < coords.length - 1; i++) {
            if (coords[i] && coords[i+1]) {
              ctx.moveTo(coords[i][0], coords[i][1]);
              ctx.lineTo(coords[i+1][0], coords[i+1][1]);
            }
          }
          ctx.stroke();

          // Draw dots
          coords.forEach(p => {
            if (p) {
              ctx.beginPath();
              ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }
      };

      skeletonWs.onclose = () => {
        skeletonWs = null;
        log('Skeleton stream closed');
      };
    }

    function stopSkelStream() {
      if (skeletonWs) {
        skeletonWs.close();
        skeletonWs = null;
      }
    }

    async function startCalibrationSession() {
      resetCalibration();
      const boardType = document.getElementById('board-type').value;
      log(`Starting calibration session (${boardType} board)...`);

      const width = parseInt(document.getElementById('board-width').value, 10);
      const height = parseInt(document.getElementById('board-height').value, 10);
      const squareSize = parseFloat(document.getElementById('square-size').value);

      if (boardType === 'chess') {
        params = {
          board_size: [width, height],
          square_size: squareSize
        };
        endpoint = (id) => `/api/calibration/start/${id}`;
      } else { // aruco
        const markerSize = parseFloat(document.getElementById('marker-size').value);
        const arucoDict = document.getElementById('aruco-dict').value;
        params = {
          board_size: [width, height],
          square_size: squareSize,
          marker_size: markerSize,
          aruco_dict: arucoDict
        };
        endpoint = (id) => `/api/calibration/start/aruco/${id}`;
      }

      for (const id of Object.keys(state)) {
        try {
          await api('POST', endpoint(id) + "?mode=manual", params);
        } catch (e) {
          log(`Calibration session start failed: ${e}`, 'error');
        }
      }
      updateCalibStatus();
    }

    async function intrinsicsCalibration() {
      log('Intrinsics calibration started...');
      for (const id of Object.keys(state)) {
        try {
          await api('POST', `/api/calibration/intrinsics/${id}`);
          log(`Intrinsics calibration for ${id} successful`, 'ok');
        } catch (e) {
          log(`Intrinsics calibration for ${id} failed: ${e}`, 'error');
        }
      }
    }

    async function clearCalibration() {
      for (const id of Object.keys(state)) {
        await api('POST', `/api/calibration/clear/${id}`);
      }
      log('Calibration samples cleared');
      updateCalibStatus();
    }

    checkServer();
    setInterval(checkServer, 5000);
    scanDevices();
    populateArucoDicts();
    toggleBoardFields();
  </script>
</body>
