[project]
name = "viki"
version = "0.1.0"
description = "Vision-based Kinematic Imitation — robot dataset generation from human RGB-D video"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyrealsense2>=2.58",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "mediapipe>=0.10.35",
    "matplotlib>=3.8",
    "streamlit>=1.37",
    "requests>=2.31",
    # streamlit pulls pandas; pin below 2.3 which requires Python >=3.11
    # (the base image is Python 3.10). pandas 2.2.x supports 3.10.
    "pandas<2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viki"]
